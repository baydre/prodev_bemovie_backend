---
# Namespace
apiVersion: v1
kind: Namespace
metadata:
  name: bemovie
---
# PostgreSQL Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: bemovie
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:15-alpine
        env:
        - name: POSTGRES_DB
          value: "bemovie_db"
        - name: POSTGRES_USER
          value: "bemovie_user"
        - name: POSTGRES_PASSWORD
          value: "bemovie_password"
        ports:
        - containerPort: 5432
        volumeMounts:
        - name: postgres-storage
          mountPath: /var/lib/postgresql/data
      volumes:
      - name: postgres-storage
        persistentVolumeClaim:
          claimName: postgres-pvc
---
# PostgreSQL PVC
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: bemovie
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
# PostgreSQL Service
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: bemovie
spec:
  selector:
    app: postgres
  ports:
  - port: 5432
    targetPort: 5432
---
# Redis Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: bemovie
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        command: ["redis-server", "--appendonly", "yes"]
        ports:
        - containerPort: 6379
        volumeMounts:
        - name: redis-storage
          mountPath: /data
      volumes:
      - name: redis-storage
        persistentVolumeClaim:
          claimName: redis-pvc
---
# Redis PVC
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-pvc
  namespace: bemovie
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
# Redis Service
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: bemovie
spec:
  selector:
    app: redis
  ports:
  - port: 6379
    targetPort: 6379
---
# Django App Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bemovie-web
  namespace: bemovie
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bemovie-web
  template:
    metadata:
      labels:
        app: bemovie-web
    spec:
      containers:
      - name: web
        image: bemovie-web:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8000
        env:
        - name: DATABASE_URL
          value: "postgres://bemovie_user:bemovie_password@postgres:5432/bemovie_db"
        - name: DATABASE_HOST
          value: "postgres"
        - name: DATABASE_PORT
          value: "5432"
        - name: REDIS_HOST
          value: "redis"
        - name: REDIS_PORT
          value: "6379"
        - name: DJANGO_SETTINGS_MODULE
          value: "movie_rec_project.production_settings"
        - name: DJANGO_SECRET_KEY
          value: "k3s-production-secret-key-change-this"
        - name: DJANGO_DEBUG
          value: "False"
        - name: DJANGO_ALLOWED_HOSTS
          value: "*"
        livenessProbe:
          httpGet:
            path: /api/health/
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /api/health/
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
---
# Django App Service
apiVersion: v1
kind: Service
metadata:
  name: bemovie-web
  namespace: bemovie
spec:
  selector:
    app: bemovie-web
  ports:
  - port: 80
    targetPort: 8000
---
# Ingress
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bemovie-ingress
  namespace: bemovie
  annotations:
    ingress.kubernetes.io/ssl-redirect: "false"
spec:
  rules:
  - host: bemovie.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: bemovie-web
            port:
              number: 80
